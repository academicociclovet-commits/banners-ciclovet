<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Avaliação de Banners · CicloVet 2026</title>
<meta name="description" content="XIII Mostra Acadêmica do CicloVet 2026: avaliação dos banners pelo celular.">

<!-- Prévia do link (WhatsApp, Instagram, etc.) -->
<!-- TROQUE "SEU-USUARIO" pelo seu nome de usuário do GitHub nas 2 linhas com https:// -->
<meta property="og:type" content="website">
<meta property="og:title" content="Avaliação de Banners · CicloVet 2026">
<meta property="og:description" content="XIII Mostra Acadêmica — entre com seu nome e a senha de avaliador.">
<meta property="og:url" content="https://SEU-USUARIO.github.io/banners-ciclovet/">
<meta property="og:image" content="https://SEU-USUARIO.github.io/banners-ciclovet/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<!-- Ícone de app no celular -->
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Banners">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
  html,body{margin:0;height:100%;background:#f9edd5;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#f9edd5}
  .carregando{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#6e6c5f;transition:opacity .3s}
  .carregando img{width:150px;height:150px;border-radius:50%}
  .carregando.some{opacity:0;pointer-events:none}
  .carregando a{color:#2f6a3a;font-size:14px}
</style>
</head>
<body>
<div class="carregando" id="carregando">
  <img src="icon-192.png" alt="CicloVet 2026">
  <div>Carregando…</div>
  <a id="direto" href="#" target="_top">Não carregou? Toque aqui</a>
</div>
<iframe id="app" title="Avaliação de Banners" allow="clipboard-write"></iframe>

<script>
  // COLE AQUI o link do App da Web do Apps Script (termina em /exec)
  const APP_URL = 'https://script.google.com/macros/s/AKfycbygNeiv8-lYy5x9ss1GF3HU408D8BlcXKWgLVDSLBOhX_0GPu7gFrdAfLpvRmy5Fwfz5Q/exec';

  const f = document.getElementById('app');
  document.getElementById('direto').href = APP_URL;
  f.addEventListener('load', () => document.getElementById('carregando').classList.add('some'));
  f.src = APP_URL;
</script>
</body>
</html>
